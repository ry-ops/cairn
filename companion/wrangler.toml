# Cairn companion: one Worker with static assets, behind Cloudflare Access.
# Deploy it with the Deploy to Cloudflare button in the README, or by hand
# (see README.md). Until ACCESS_TEAM_DOMAIN and ACCESS_AUD are set, every API
# call is refused, so a fresh deploy serves no notes.
# Secret (wrangler secret put GITHUB_TOKEN): a fine-grained token with
# Contents read and write on the vault repo only.
name = "cairn-companion"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false
# Every deploy sets the [vars] below from this file, so change them here, not
# in the dashboard. keep_vars only keeps variables that aren't listed here.
keep_vars = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
VAULT_REPO = "you/your-cairn-vault"
VAULT_BRANCH = "main"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ALLOWED_EMAILS = ""
