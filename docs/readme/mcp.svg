<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="In a terminal, Claude searches the vault with cairn_search, answers from the note, then appends two lines that appear in Cairn."><title>In a terminal, Claude searches the vault with cairn_search, answers from the note, then appends two lines that appear in Cairn.</title><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g" result="a"><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer><feComposite in="a" in2="SourceGraphic" operator="in" result="speck"/><feBlend in="SourceGraphic" in2="speck" mode="multiply"/></filter><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="5" result="b"/><feFlood flood-color="#2a1e12" flood-opacity="0.28"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="diecut" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="3" result="edge"/><feFlood flood-color="#fbf8f1"/><feComposite in2="edge" operator="in" result="margin"/><feGaussianBlur in="edge" stdDeviation="1.6" result="blur"/><feOffset in="blur" dx="0.8" dy="1.6" result="drop"/><feFlood flood-color="#000" flood-opacity="0.32"/><feComposite in2="drop" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="margin"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="mg" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="rgba(64,98,128,0.16)" stroke-width="1"/></pattern></defs><rect x="1" y="1" width="878" height="378" rx="18" fill="#e7dcc8" stroke="rgba(42,38,34,0.14)"/><text x="36" y="44" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="12" font-weight="700" fill="#d4552a" text-anchor="start" letter-spacing="2.4">CLAUDE CAN READ IT</text><text x="36" y="64" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="14" font-weight="400" fill="#5d554b" text-anchor="start">cairn-mcp is a local MCP server: Claude searches and reads your notes, and can add to them. It never edits or deletes.</text><g filter="url(#lift)"><rect x="36" y="80" width="470" height="270" rx="12" fill="#1f1c18"/></g><circle cx="54" cy="98" r="5" fill="#ec6a5e"/><circle cx="70" cy="98" r="5" fill="#f4be4f"/><circle cx="86" cy="98" r="5" fill="#61c454"/><clipPath id="m0"><rect x="56" y="119.5" height="18.75" width="0"><animate attributeName="width" values="0;0;304;304;0" keyTimes="0;0.043;0.157;0.971;1" dur="14s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#m0)"><text x="56" y="132" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#e9e2d4" text-anchor="start">&gt; What did I write about the ridge loop?</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.171;0.186;0.964;0.979;1" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><text x="56" y="157" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#f0a274" text-anchor="start">● cairn_search(&quot;ridge loop&quot;)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.214;0.964;0.979;1" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><text x="56" y="182" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#b5ab9b" text-anchor="start" xml:space="preserve">  └ Ridge loop · Trail Log · Nov 16</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.243;0.257;0.964;0.979;1" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><text x="56" y="207" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#e9e2d4" text-anchor="start">Switchbacks before sunrise, a taller cairn</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.257;0.271;0.964;0.979;1" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><text x="56" y="232" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#e9e2d4" text-anchor="start">at the top, frost on the boardwalk.</text></g><clipPath id="m5"><rect x="56" y="244.5" height="18.75" width="0"><animate attributeName="width" values="0;0;281.5;281.5;0" keyTimes="0;0.386;0.486;0.971;1" dur="14s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#m5)"><text x="56" y="257" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#e9e2d4" text-anchor="start">&gt; Add today's trail conditions to it.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.514;0.529;0.964;0.979;1" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><text x="56" y="282" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#f0a274" text-anchor="start">● cairn_append(&quot;Ridge loop&quot;, …)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.543;0.557;0.964;0.979;1" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><text x="56" y="307" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#b5ab9b" text-anchor="start" xml:space="preserve">  └ Added 2 lines</text></g><g filter="url(#lift)"><rect x="530" y="80" width="314" height="270" rx="12" fill="#fbf8f1"/></g><rect x="530" y="80" width="314" height="270" rx="12" fill="url(#mg)"/><text x="552" y="118" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="19" font-weight="700" fill="#2a2622" text-anchor="start">Ridge loop</text><text x="552" y="148" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">Up the switchbacks before</text><text x="552" y="170" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">sunrise. The cairn at the</text><text x="552" y="192" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">top was taller than last</text><text x="552" y="214" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">fall.</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.571;0.596;0.964;0.989;1" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><rect x="544" y="248" width="286" height="54" rx="6" fill="#d4552a" opacity="0.1"/><text x="552" y="268" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">Nov 17: dry and fast,</text><text x="552" y="290" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">ice gone from the bridge.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.586;0.611;0.964;0.989;1" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><rect x="698" y="316" width="118.8" height="22.5" rx="11.25" fill="#fff" stroke="rgba(42,38,34,0.12)"/><text x="757.4" y="329.5" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="10.5" font-weight="600" fill="#2a2622" text-anchor="middle">appears in Cairn</text></g></svg>
