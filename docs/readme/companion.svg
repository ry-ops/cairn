<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="On a phone, the companion lists notebooks and saves a quick capture as a signed commit that Cairn picks up on its next sync."><title>On a phone, the companion lists notebooks and saves a quick capture as a signed commit that Cairn picks up on its next sync.</title><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g" result="a"><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer><feComposite in="a" in2="SourceGraphic" operator="in" result="speck"/><feBlend in="SourceGraphic" in2="speck" mode="multiply"/></filter><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="5" result="b"/><feFlood flood-color="#2a1e12" flood-opacity="0.28"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="diecut" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="3" result="edge"/><feFlood flood-color="#fbf8f1"/><feComposite in2="edge" operator="in" result="margin"/><feGaussianBlur in="edge" stdDeviation="1.6" result="blur"/><feOffset in="blur" dx="0.8" dy="1.6" result="drop"/><feFlood flood-color="#000" flood-opacity="0.32"/><feComposite in2="drop" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="margin"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="878" height="428" rx="18" fill="#e7dcc8" stroke="rgba(42,38,34,0.14)"/><text x="36" y="44" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="12" font-weight="700" fill="#d4552a" text-anchor="start" letter-spacing="2.4">THE COMPANION</text><text x="36" y="64" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="14" font-weight="400" fill="#5d554b" text-anchor="start">Read, search and jot from any browser, phone included. Your own Cloudflare account, behind Cloudflare Access.</text><g filter="url(#lift)"><rect x="70" y="80" width="200" height="336" rx="30" fill="#1d1d1f"/></g><rect x="79" y="89" width="182" height="318" rx="22" fill="#fbf8f1"/><rect x="79" y="89" width="182" height="44" rx="22" fill="#efe7d8"/><rect x="79" y="111" width="182" height="22" fill="#efe7d8"/><text x="170" y="120" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="10.5" font-weight="600" fill="#5d554b" text-anchor="middle">🔒 notes.example.com</text><text x="92" y="158" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="12" font-weight="700" fill="#2a2622" text-anchor="start" letter-spacing="3">CAIRN</text><rect x="90" y="176" width="160" height="32" rx="7" fill="#fff" stroke="rgba(42,38,34,0.12)"/><text x="100" y="197" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="600" fill="#2a2622" text-anchor="start">Trail Log</text><text x="240" y="197" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="10" font-weight="400" fill="#5d554b" text-anchor="end">4 notes</text><rect x="90" y="216" width="160" height="32" rx="7" fill="#fff" stroke="rgba(42,38,34,0.12)"/><text x="100" y="237" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="600" fill="#2a2622" text-anchor="start">North Shore</text><text x="240" y="237" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="10" font-weight="400" fill="#5d554b" text-anchor="end">3 notes</text><rect x="90" y="256" width="160" height="32" rx="7" fill="#fff" stroke="rgba(42,38,34,0.12)"/><text x="100" y="277" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="600" fill="#2a2622" text-anchor="start">Bench Notes</text><text x="240" y="277" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="10" font-weight="400" fill="#5d554b" text-anchor="end">7 notes</text><rect x="90" y="310" width="160" height="56" rx="8" fill="#fff" stroke="#d4552a"/><text x="100" y="328" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="8.5" font-weight="700" fill="#d4552a" text-anchor="start" letter-spacing="1.4">QUICK CAPTURE</text><clipPath id="q0"><rect x="100" y="339.5" height="15.75" width="0"><animate attributeName="width" values="0;0;136.3;136.3;0" keyTimes="0;0.092;0.2;0.969;1" dur="13s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#q0)"><text x="100" y="350" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="10.5" font-weight="400" fill="#2a2622" text-anchor="start">Moose at Lutsen, 6:40</text></g><rect y="341.075" width="1.6" height="11.55" fill="#d4552a" opacity="0"><animate attributeName="x" values="100;100;233.3;233.3" keyTimes="0;0.092;0.2;1" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.092;0.092;0.246;0.247;1" dur="13s" repeatCount="indefinite"/></rect><rect x="186" y="374" width="64" height="22" rx="11" fill="#2a2622"/><text x="218" y="389" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Save</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.231;0.246;0.962;0.977;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><rect x="90" y="374" width="90" height="22" rx="11" fill="#dafbe1"/><text x="135" y="389" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="10.5" font-weight="700" fill="#1a7f37" text-anchor="middle">✓ saved</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.277;0.304;0.962;0.988;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><path d="M290 220 H320" stroke="#a89c8b" stroke-width="2" stroke-dasharray="4 5"/><g filter="url(#lift)"><rect x="320" y="176" width="170" height="90" rx="12" fill="#fff"/></g><circle cx="344" cy="204" r="9" fill="#24292f"/><text x="360" y="209" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="700" fill="#2a2622" text-anchor="start">you/cairn-vault</text><text x="338" y="240" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="11.5" font-weight="400" fill="#5d554b" text-anchor="start">signed commit</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.431;0.458;0.962;0.988;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><path d="M490 220 H520" stroke="#a89c8b" stroke-width="2" stroke-dasharray="4 5"/><g filter="url(#lift)"><rect x="520" y="176" width="170" height="90" rx="12" fill="#fff"/></g><circle cx="544" cy="204" r="9" fill="#d4552a"/><text x="560" y="209" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="700" fill="#2a2622" text-anchor="start">Cairn on your Mac</text><text x="538" y="240" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="11.5" font-weight="400" fill="#5d554b" text-anchor="start">next sync</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.554;0.581;0.962;0.988;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><rect x="560" y="276" width="150.3" height="22.5" rx="11.25" fill="#fff" stroke="rgba(42,38,34,0.12)"/><text x="635.15" y="289.5" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="10.5" font-weight="600" fill="#2a2622" text-anchor="middle">new note in Trail Log</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.615;0.642;0.962;0.988;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><text x="320" y="330" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="400" fill="#5d554b" text-anchor="start">Access at the edge, plus a token check in every function.</text><text x="320" y="350" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="400" fill="#5d554b" text-anchor="start">It reads only what has synced to your vault repo.</text></g></svg>
