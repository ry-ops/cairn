<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Choosing an empty folder opens a First Cairn notebook with a welcome note, and the Sync sheet creates a private vault repo."><title>Choosing an empty folder opens a First Cairn notebook with a welcome note, and the Sync sheet creates a private vault repo.</title><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g" result="a"><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer><feComposite in="a" in2="SourceGraphic" operator="in" result="speck"/><feBlend in="SourceGraphic" in2="speck" mode="multiply"/></filter><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="5" result="b"/><feFlood flood-color="#2a1e12" flood-opacity="0.28"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="diecut" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceAlpha" operator="dilate" radius="3" result="edge"/><feFlood flood-color="#fbf8f1"/><feComposite in2="edge" operator="in" result="margin"/><feGaussianBlur in="edge" stdDeviation="1.6" result="blur"/><feOffset in="blur" dx="0.8" dy="1.6" result="drop"/><feFlood flood-color="#000" flood-opacity="0.32"/><feComposite in2="drop" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="margin"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="ug" width="15" height="15" patternUnits="userSpaceOnUse"><path d="M15 0H0V15" fill="none" stroke="rgba(64,98,128,0.16)" stroke-width="1"/></pattern></defs><rect x="1" y="1" width="878" height="378" rx="18" fill="#e7dcc8" stroke="rgba(42,38,34,0.14)"/><text x="36" y="44" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="12" font-weight="700" fill="#d4552a" text-anchor="start" letter-spacing="2.4">A VAULT THAT SETS ITSELF UP</text><text x="36" y="64" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="14" font-weight="400" fill="#5d554b" text-anchor="start">Pick an empty folder and your first notebook is waiting. Cairn can make the GitHub repo too.</text><g filter="url(#lift)"><rect x="36" y="80" width="380" height="270" rx="12" fill="#fbf8f1"/></g><rect x="36" y="80" width="380" height="28" rx="12" fill="#efe7d8"/><rect x="36" y="96" width="380" height="12" fill="#efe7d8"/><line x1="36" y1="108" x2="416" y2="108" stroke="rgba(42,38,34,0.12)"/><circle cx="52" cy="94" r="5.2" fill="#ec6a5e"/><circle cx="69" cy="94" r="5.2" fill="#f4be4f"/><circle cx="86" cy="94" r="5.2" fill="#61c454"/><text x="226" y="98.5" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="600" fill="#5d554b" text-anchor="middle">Cairn</text><g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.138;0.162;0.969;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><text x="226" y="186" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="26" font-weight="700" fill="#2a2622" text-anchor="middle" letter-spacing="4">Cairn</text><text x="226" y="210" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="400" fill="#5d554b" text-anchor="middle">Notes as markers you leave behind.</text><rect x="156" y="226" width="140" height="30" rx="8" fill="#d4552a"/><text x="226" y="246" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Choose vault folder…</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.154;0.181;0.962;0.988;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><rect x="36" y="108" width="110" height="242" fill="#e7dcc8"/><g><g filter="url(#lift)"><rect x="52" y="124" width="78" height="122.571" rx="2.786" fill="#000" opacity="0.001"/></g><svg x="52" y="124" width="78" height="122.571" viewBox="0 0 140 220" overflow="visible"><clipPath id="cc1"><rect width="140" height="220" rx="5"/></clipPath><g clip-path="url(#cc1)"><rect width="140" height="220" fill="#c49a6c" filter="url(#grain)"/><g transform="translate(50 64)" fill="#2b2118"><ellipse cx="20" cy="56" rx="22" ry="7"/><ellipse cx="18.5" cy="42" rx="16.5" ry="6.2"/><ellipse cx="21.5" cy="30" rx="11.8" ry="5.3"/><ellipse cx="20" cy="19.5" rx="7.6" ry="4.4"/><ellipse cx="20.8" cy="11" rx="4.1" ry="3.1"/></g><rect width="7" height="220" fill="#000" opacity="0.1"/><rect x="2.2" y="52" width="2.2" height="18" rx="1" fill="#b9bcc0"/><rect x="2.2" y="150" width="2.2" height="18" rx="1" fill="#b9bcc0"/></g><text x="18" y="26" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="9" font-weight="700" fill="#2b2118" text-anchor="start" letter-spacing="2.4">No. 0001</text><rect x="16" y="150" width="108" height="46" fill="none" fill-opacity="0.92" stroke="#2b2118" stroke-width="1.2"/><text x="70" y="177" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="11" font-weight="700" fill="#2b2118" text-anchor="middle" letter-spacing="1.4">FIRST CAIRN</text></svg></g><rect x="146" y="108" width="270" height="242" fill="url(#ug)"/><text x="166" y="146" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="20" font-weight="700" fill="#2a2622" text-anchor="start">Welcome</text><text x="166" y="176" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="11.5" font-weight="400" fill="#2a2622" text-anchor="start">This is your first</text><text x="166" y="196" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="11.5" font-weight="400" fill="#2a2622" text-anchor="start">notebook. Every page</text><text x="166" y="216" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="11.5" font-weight="400" fill="#2a2622" text-anchor="start">is a markdown file</text><text x="166" y="236" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="11.5" font-weight="400" fill="#2a2622" text-anchor="start">in your folder.</text><text x="166" y="276" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="12" font-weight="400" fill="#a89c8b" text-anchor="start">## Getting around</text></g><g filter="url(#lift)"><rect x="450" y="80" width="394" height="270" rx="12" fill="#fff"/></g><text x="470" y="110" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="13" font-weight="700" fill="#2a2622" text-anchor="start" letter-spacing="3">SYNC</text><text x="470" y="138" font-family='Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif' font-size="9.5" font-weight="700" fill="#5d554b" text-anchor="start" letter-spacing="1.6">REPOSITORY</text><rect x="470" y="146" width="354" height="32" rx="6" fill="#fbf8f1" stroke="rgba(42,38,34,0.12)"/><clipPath id="u0"><rect x="482" y="154" height="19.5" width="0"><animate attributeName="width" values="0;0;121;121;0" keyTimes="0;0.246;0.315;0.969;1" dur="13s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#u0)"><text x="482" y="167" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">you/cairn-vault</text></g><rect y="155.95" width="1.6" height="14.3" fill="#d4552a" opacity="0"><animate attributeName="x" values="482;482;600;600" keyTimes="0;0.246;0.315;1" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.245;0.246;0.362;0.362;1" dur="13s" repeatCount="indefinite"/></rect><rect x="736" y="188" width="88" height="28" rx="7" fill="#fff" stroke="rgba(42,38,34,0.12)"/><text x="780" y="207" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="600" fill="#2a2622" text-anchor="middle">Preview</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.377;0.396;0.585;0.604;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><rect x="470" y="228" width="354" height="60" rx="8" fill="#fbf1e6"/><text x="482" y="250" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="600" fill="#2a2622" text-anchor="start">you/cairn-vault doesn't exist yet.</text><text x="482" y="270" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="400" fill="#5d554b" text-anchor="start">Create it as a private repository?</text><rect x="698" y="298" width="126" height="30" rx="8" fill="#d4552a"/><text x="761" y="318" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Create private repo</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.615;0.635;0.962;0.981;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><rect x="470" y="228" width="354" height="100" rx="8" fill="#eef6ec"/><text x="482" y="252" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12.5" font-weight="700" fill="#1a7f37" text-anchor="start">✓ Created you/cairn-vault (private)</text><text x="482" y="276" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">First sync: 2 files go up</text><text x="482" y="296" font-family='"iA Writer Duo S", "SF Mono", Menlo, Consolas, monospace' font-size="11" font-weight="400" fill="#5d554b" text-anchor="start">notebooks/0001-first-cairn/…</text><rect x="714" y="298" width="110" height="26" rx="7" fill="#2a2622"/><text x="769" y="316" font-family='"Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif' font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">Link and sync</text></g><g><animateTransform attributeName="transform" type="translate" values="300 300;232 244;234 246;650 170;780 206;782 208;770 316;772 318;780 330;300 300" keyTimes="0;0.092;0.138;0.2;0.323;0.354;0.492;0.585;0.731;1" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/><path d="M0 0 L0 17 L4.5 13 L7.5 20 L10 19 L7 12 L13 12 Z" fill="#111" stroke="#fff" stroke-width="1.2"/></g></svg>
