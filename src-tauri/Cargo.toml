[package]
name = "cairn"
version = "0.14.1"
description = "Cairn — a field-notes-style markdown notebook app"
authors = ["ry-ops"]
edition = "2024"
default-run = "cairn"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
