<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- cairn-cover · button · watercolor · the light on the headland -->
  <defs>
    <clipPath id="disc"><circle cx="100" cy="100" r="100"/></clipPath>
    <filter id="wash" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1"/>
    </filter>
    <filter id="coldpress"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/><feDiffuseLighting in="n" lighting-color="#ffffff" surfaceScale="1.4"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting></filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f9fb8"/><stop offset="0.55" stop-color="#c9c9c0"/><stop offset="1" stop-color="#ecd3ad"/></linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d8299"/><stop offset="1" stop-color="#28485e"/></linearGradient>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="200" height="200" fill="#f5f0e4"/>
    <g style="mix-blend-mode:multiply">
      <rect x="-10" y="-10" width="220" height="140" fill="url(#sky)" opacity="0.8" filter="url(#wash)"/>
      <circle cx="146" cy="58" r="18" fill="#f0b765" opacity="0.7" filter="url(#wash)"/>
      <path d="M-10 118 C 30 100, 70 98, 110 110 C 150 120, 180 104, 210 108 L210 140 L-10 140 Z" fill="#567278" opacity="0.6" filter="url(#wash)"/>
      <rect x="-10" y="128" width="220" height="90" fill="url(#lake)" opacity="0.8" filter="url(#wash)"/>
      <path d="M-10 124 L40 116 Q 76 116 92 136 L100 160 Q 50 168 -10 170 Z" fill="#2f4446" opacity="0.9" filter="url(#wash)"/>
    </g>
    <rect x="44" y="76" width="12" height="42" fill="#efe9dc"/>
    <path d="M42 76 L58 76 L50 64 Z" fill="#9c3b2b"/>
    <circle cx="50" cy="84" r="3" fill="#f3c46e"/>
    <path d="M120 150 h48 M136 162 h30" stroke="#e7eef0" stroke-width="2.4" stroke-linecap="round" opacity="0.6"/>
    <rect width="200" height="200" filter="url(#coldpress)" opacity="0.3" style="mix-blend-mode:multiply"/>
  </g>
</svg>
