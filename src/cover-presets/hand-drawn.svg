<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 550">
  <!-- cairn-cover · style: hand-drawn · "Ridge Sketches" (Cairn No. 0006) -->
  <defs>
    <clipPath id="page"><rect width="350" height="550"/></clipPath>
    <!-- Pen jitter: nothing is ruler-straight. -->
    <filter id="pen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#2a2420" stroke-width="0.9"/>
    </pattern>
    <pattern id="crosshatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-42)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#2a2420" stroke-width="0.8"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.16"/></feComponentTransfer>
    </filter>
  </defs>
  <g clip-path="url(#page)">

  <rect width="350" height="550" fill="#ece3cf"/>

  <g fill="none" stroke="#2a2420" stroke-linecap="round" stroke-linejoin="round" filter="url(#pen)">
    <!-- hand-ruled frame, corners overshoot -->
    <path pathLength="1" stroke-dasharray="1" d="M14 22 H336 M22 14 V536 M328 14 V536 M14 528 H336" stroke-width="1.2"><animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.3;1" calcMode="spline" keySplines="0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>

    <!-- sun with dashed rays -->
    <circle pathLength="1" stroke-dasharray="1" cx="262" cy="104" r="18" stroke-width="1.6"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.08;0.3;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.09;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></circle>
    <g stroke-width="1.3"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.34;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/>
      <path d="M262 76 v-9 M262 132 v9 M234 104 h-9 M290 104 h9 M242 84 l-6 -6 M282 84 l6 -6 M242 124 l-6 6 M282 124 l6 6"/>
    </g>

    <!-- a cloud, looped -->
    <path pathLength="1" stroke-dasharray="1" d="M60 116 q 4 -14 18 -10 q 6 -12 20 -6 q 12 -6 18 6 q 12 2 8 12 Z" stroke-width="1.3"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.12;0.34;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.13;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>

    <!-- far range -->
    <path pathLength="1" stroke-dasharray="1" d="M22 236 L58 198 L80 214 L112 168 L140 204 L162 186 L196 222 L226 176 L258 210 L284 192 L328 232" stroke-width="1.1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.2;0.5;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.21;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>
    <!-- near range, heavier line -->
    <path pathLength="1" stroke-dasharray="1" d="M22 286 L72 228 L98 250 L140 196 L184 258 L214 232 L250 268 L292 222 L328 262" stroke-width="2.2"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.3;0.6;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.31;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>
    <!-- contour ticks on the near range -->
    <path d="M140 196 l-8 18 M140 196 l10 20 M292 222 l-8 16 M292 222 l9 18 M72 228 l-6 14" stroke-width="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.65;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>
  </g>

  <!-- shadow-side hatching -->
  <g filter="url(#pen)">
    <path d="M140 196 L184 258 L150 262 Z" fill="url(#hatch)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.86;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1" dur="2.6s" fill="freeze"/></path>
    <path d="M292 222 L328 262 L300 266 Z" fill="url(#hatch)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.86;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1" dur="2.6s" fill="freeze"/></path>
    <path d="M72 228 L98 250 L76 258 Z" fill="url(#hatch)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.86;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1" dur="2.6s" fill="freeze"/></path>
    <path d="M150 248 L184 258 L160 264 Z" fill="url(#crosshatch)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.86;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1" dur="2.6s" fill="freeze"/></path>
  </g>

  <g fill="none" stroke="#2a2420" stroke-linecap="round" stroke-linejoin="round" filter="url(#pen)">
    <!-- the ridge we're standing on -->
    <path pathLength="1" stroke-dasharray="1" d="M22 344 C 90 326, 150 318, 196 322 S 290 336, 328 330" stroke-width="2.4"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.42;0.68;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.43;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>

    <!-- pines -->
    <path pathLength="1" stroke-dasharray="1" d="M52 340 V300 M52 302 l-10 12 h20 Z M52 312 l-14 16 h28 Z M52 324 l-17 18 h34" stroke-width="1.4"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.52;0.74;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.53;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>
    <path pathLength="1" stroke-dasharray="1" d="M290 334 V292 M290 294 l-9 11 h18 Z M290 304 l-13 15 h26 Z M290 316 l-16 17 h32" stroke-width="1.4"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.56;0.78;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.57;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>
    <path pathLength="1" stroke-dasharray="1" d="M308 332 V306 M308 308 l-7 9 h14 Z M308 316 l-10 12 h20" stroke-width="1.1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.6;0.8;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.61;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>

    <!-- the cairn: stones drawn bottom to top, then the top one teeters and settles -->
    <ellipse pathLength="1" stroke-dasharray="1" cx="176" cy="314" rx="26" ry="8" stroke-width="1.8"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.50;0.60;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.51;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></ellipse>
    <ellipse pathLength="1" stroke-dasharray="1" cx="173" cy="298" rx="19" ry="7" stroke-width="1.8"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.54;0.64;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.55;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></ellipse>
    <ellipse pathLength="1" stroke-dasharray="1" cx="178" cy="284" rx="14" ry="6" stroke-width="1.8"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.58;0.68;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.59;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></ellipse>
    <ellipse pathLength="1" stroke-dasharray="1" cx="176" cy="272" rx="9" ry="4.5" stroke-width="1.8"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.62;0.72;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.63;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></ellipse>
    <g><animateTransform attributeName="transform" type="rotate" values="0 177 266.4;0 177 266.4;-30 177 266.4;12 177 266.4;-5 177 266.4;2 177 266.4;0 177 266.4" keyTimes="0;0.78;0.85;0.91;0.95;0.98;1" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1" dur="2.6s" fill="freeze"/><ellipse pathLength="1" stroke-dasharray="1" cx="177" cy="263" rx="5" ry="3.4" stroke-width="1.8"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.66;0.76;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.67;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></ellipse></g>

    <!-- grass ticks (kept low: label zone below stays quiet) -->
    <path d="M90 334 l3 -7 l2 7 M118 328 l2 -6 l3 6 M238 330 l3 -7 l2 7 M262 333 l2 -6 l3 6" stroke-width="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.92;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>

    <!-- trail switchbacks down the slope -->
    <path d="M200 324 q 30 10 10 18 q -24 8 6 16" stroke-width="1" stroke-dasharray="3 4"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.94;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>

    <!-- small compass at the foot -->
    <circle cx="175" cy="512" r="9" stroke-width="1.1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.96;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></circle>
    <path d="M175 500 V524 M163 512 H187" stroke-width="0.9"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.96;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>
    <path d="M175 503 l3 9 l-3 -2 l-3 2 Z" fill="#2a2420" stroke-width="0.8"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.88;0.98;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1;0 0 1 1" dur="2.6s" fill="freeze"/></path>
  </g>

  <!-- under-stone shadows -->
  <g filter="url(#pen)">
    <path d="M152 316 Q 176 326 202 316 L 200 320 Q 176 328 154 320 Z" fill="url(#hatch)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.86;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1" dur="2.6s" fill="freeze"/></path>
    <path d="M156 300 Q 173 308 191 300 L 189 304 Q 173 310 158 304 Z" fill="url(#hatch)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.86;1" calcMode="spline" keySplines="0 0 1 1;0.25 0.6 0.3 1" dur="2.6s" fill="freeze"/></path>
  </g>

  <rect width="350" height="550" filter="url(#grain)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
